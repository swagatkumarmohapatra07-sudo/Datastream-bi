<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataStream — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    #root { height: 100%; }

    body[data-theme="dark"] { background: #0f172a !important; }
    body[data-theme="dark"] .card-in { background: #1e293b !important; border-color: #334155 !important; }
    body[data-theme="dark"] .card-in h2, body[data-theme="dark"] .card-in h1 { color: #f1f5f9 !important; }
    body[data-theme="dark"] .card-in p, body[data-theme="dark"] .card-in label { color: #94a3b8 !important; }
    body[data-theme="dark"] input { background: #334155 !important; border-color: #475569 !important; color: #f1f5f9 !important; }
    body[data-theme="dark"] input::placeholder { color: #64748b !important; }
    body[data-theme="dark"] .show-btn { background: #334155 !important; color: #94a3b8 !important; border-left-color: #475569 !important; }
    body[data-theme="dark"] .show-btn:hover { background: #475569 !important; }
    body[data-theme="dark"] .chk { background: #334155 !important; border-color: #475569 !important; }
    body[data-theme="dark"] .btn-primary { background: #818cf8 !important; }
    body[data-theme="dark"] .btn-primary:hover { background: #6366F1 !important; }

    .card-in { animation: cardIn 0.5s cubic-bezier(0.22,1,0.36,1) forwards; }
    @keyframes cardIn {
      0% { opacity: 0; transform: translateY(20px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .fade-in { animation: fadeIn 0.4s ease forwards; opacity: 0; }
    @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
    .d1 { animation-delay: 0.08s; } .d2 { animation-delay: 0.16s; }
    .d3 { animation-delay: 0.24s; } .d4 { animation-delay: 0.32s; }
    .d5 { animation-delay: 0.40s; }

    .input-focus:focus {
      border-color: #6366F1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }

    .btn-primary {
      background: #6366F1; color: #fff; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:active { transform: scale(0.97); }

    .scroll-wrap {
      display: flex; flex-direction: column;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .scroll-wrap > .card-in { margin: auto; }

    .chk-box:checked + .chk {
      background: #6366F1; border-color: #6366F1;
    }
    .chk-box:checked + .chk::after {
      content: ''; position: absolute; left: 4px; top: 1px;
      width: 5px; height: 9px;
      border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
    }

    .show-btn {
      font-size: 11px; font-weight: 600; color: #64748b;
      background: #f1f5f9; border-left: 1px solid #e2e8f0;
      padding: 0 10px; cursor: pointer; white-space: nowrap;
      display: flex; align-items: center; gap: 4px; transition: background 0.15s;
    }
    .show-btn:hover { background: #e2e8f0; }

    input, button { -webkit-tap-highlight-color: transparent; }
    button { touch-action: manipulation; }
    @media (pointer: coarse) { input, button { min-height: 44px; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    function LoginPage() {
      const [tab, setTab] = useState('login');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPw, setShowPw] = useState(false);
      const [remember, setRemember] = useState(true);

      const [sName, setSName] = useState('');
      const [sEmail, setSEmail] = useState('');
      const [sPass, setSPass] = useState('');
      const [sConfirm, setSConfirm] = useState('');
      const [showSPw, setShowSPw] = useState(false);
      const [showSCon, setShowSCon] = useState(false);

      const [error, setError] = useState('');
      const [forgot, setForgot] = useState(false);
      const [fEmail, setFEmail] = useState('');
      const [fMsg, setFMsg] = useState('');

      var isLogin = tab === 'login';

      function saveSession(name, email, initials, role) {
        sessionStorage.setItem('datastream_bi_session', JSON.stringify({ name: name, email: email, initials: initials, role: role || 'viewer' }));
        window.location.href = 'index.html';
      }

      function handleLogin(e) {
        e.preventDefault();
        if (!email.trim() || !password.trim()) { setError('Please enter both email and password.'); return; }
        setError('');
        var foundRole = 'viewer';
        try {
          var users = JSON.parse(localStorage.getItem('datastream_bi_users') || '[]');
          for (var u = 0; u < users.length; u++) {
            if (users[u].email === email.trim()) { foundRole = users[u].role || 'viewer'; break; }
          }
        } catch (er) {}
        saveSession(email.split('@')[0], email, email.slice(0,2).toUpperCase(), foundRole);
      }

      function handleSignup(e) {
        e.preventDefault();
        if (!sName.trim() || !sEmail.trim() || !sPass.trim() || !sConfirm.trim()) { setError('Please fill in all fields.'); return; }
        if (sPass.length < 6) { setError('Password must be at least 6 characters.'); return; }
        if (sPass !== sConfirm) { setError('Passwords do not match.'); return; }
        setError('');
        var initials = sName.trim().split(/\s+/).slice(0,2).map(function(w) { return w[0].toUpperCase(); }).join('') || 'U';
        try {
          var users = JSON.parse(localStorage.getItem('datastream_bi_users') || '[]');
          users.push({ name: sName.trim(), email: sEmail.trim(), password: sPass, initials: initials, role: 'creator' });
          localStorage.setItem('datastream_bi_users', JSON.stringify(users));
        } catch (er) {}
        saveSession(sName.trim(), sEmail.trim(), initials, 'creator');
      }

      function handleForgot(e) {
        e.preventDefault();
        setFMsg('');
        if (!fEmail.trim()) { setError('Enter your email address.'); return; }
        setError('');
        try {
          var data = JSON.parse(localStorage.getItem('datastream_bi_users') || '[]');
          var user = data.find(function(u) { return u.email === fEmail.trim(); });
          if (user) { setFMsg('Your password is: <strong>' + user.password + '</strong>'); }
          else { setError('No account found with that email.'); }
        } catch (err) { setError('Something went wrong.'); }
      }

      function switchTab(t) { setTab(t); setError(''); setForgot(false); }

      return (
        <div className="scroll-wrap h-full w-full bg-[#f8fafc] font-['Inter',sans-serif] p-3 sm:p-4 md:p-5">

          <div className="card-in w-full max-w-[340px] sm:max-w-[420px] md:max-w-[460px] bg-white border border-[#e2e8f0] rounded-xl shadow-[0_4px_16px_rgba(0,0,0,0.06)]">

            <div className="p-6 sm:p-8 md:p-10">

              <div className="fade-in d1 text-center mb-5 sm:mb-6">
                <div className="w-10 h-10 mx-auto mb-3 bg-[#6366F1]/10 rounded-lg flex items-center justify-center">
                  <svg className="w-5 h-5 text-[#6366F1]" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" /></svg>
                </div>
                <h2 className="text-lg sm:text-xl font-bold text-[#1e293b] tracking-tight">DataStream BI</h2>
                <p className="text-xs text-[#64748b] mt-1">E-Commerce Analytics Platform</p>
              </div>

              <h1 className="fade-in d2 text-[#1e293b] text-xl sm:text-2xl font-semibold tracking-tight mb-1">
                {forgot ? 'Reset password' : (isLogin ? 'Welcome back' : 'Create account')}
              </h1>
              <p className="fade-in d3 text-xs sm:text-sm text-[#64748b] mb-5 sm:mb-6">
                {forgot ? 'Enter your email to retrieve your password.' : (isLogin ? 'Sign in to your dashboard.' : 'Get started with your account.')}
              </p>

              {!forgot && (
                <div className="fade-in d3 flex mb-5 rounded-lg border border-[#e2e8f0] overflow-hidden">
                  <button className={"flex-1 py-2 text-xs sm:text-sm font-medium transition-all " + (isLogin ? 'bg-[#6366F1] text-white' : 'bg-white text-[#64748b] hover:text-[#1e293b]')} onClick={function() { switchTab('login'); }}>Sign In</button>
                  <button className={"flex-1 py-2 text-xs sm:text-sm font-medium transition-all border-l border-[#e2e8f0] " + (isLogin ? 'bg-white text-[#64748b] hover:text-[#1e293b]' : 'bg-[#6366F1] text-white')} onClick={function() { switchTab('signup'); }}>Sign Up</button>
                </div>
              )}

              {isLogin && forgot ? (
                <form onSubmit={handleForgot} className="fade-in d4 space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-[#64748b] mb-1.5">Email</label>
                    <input type="email" value={fEmail} onChange={function(e) { setFEmail(e.target.value); }}
                      placeholder="you@example.com"
                      className="input-focus w-full px-3.5 py-2.5 bg-[#f8fafc] border border-[#e2e8f0] rounded-lg text-sm text-[#1e293b] placeholder:text-[#94a3b8] outline-none transition-colors"
                    />
                  </div>

                  {fMsg && (
                    <div className="bg-[#f0fdf4] border border-[#86efac] text-[#16a34a] text-sm font-medium px-3 py-2 rounded-lg">{fMsg}</div>
                  )}
                  {error && (
                    <div className="bg-[#fef2f2] border border-[#fca5a5] text-[#dc2626] text-sm font-medium px-3 py-2 rounded-lg">{error}</div>
                  )}

                  <button type="submit" className="btn-primary w-full py-2.5 text-sm">Show Password</button>

                  <button type="button" onClick={function() { setForgot(false); setFEmail(''); setFMsg(''); setError(''); }}
                    className="w-full text-center text-xs text-[#64748b] hover:text-[#6366F1] transition-colors bg-transparent border-0 font-medium"
                  >&larr; Back to Sign In</button>
                </form>
              ) : isLogin ? (
                <form onSubmit={handleLogin} className="fade-in d4 space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-[#64748b] mb-1.5">Email</label>
                    <input type="email" value={email} onChange={function(e) { setEmail(e.target.value); }}
                      placeholder="you@example.com"
                      className="input-focus w-full px-3.5 py-2.5 bg-[#f8fafc] border border-[#e2e8f0] rounded-lg text-sm text-[#1e293b] placeholder:text-[#94a3b8] outline-none transition-colors"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-[#64748b] mb-1.5">Password</label>
                    <div className="flex border border-[#e2e8f0] rounded-lg overflow-hidden bg-[#f8fafc]">
                      <input type={showPw ? 'text' : 'password'} value={password} onChange={function(e) { setPassword(e.target.value); }}
                        placeholder="Enter password"
                        className="flex-1 min-w-0 px-3.5 py-2.5 bg-transparent text-sm text-[#1e293b] placeholder:text-[#94a3b8] outline-none border-0"
                      />
                      <button type="button" onClick={function() { setShowPw(!showPw); }} className="show-btn">
                        {showPw ? <EyeClosed /> : <EyeOpen />}
                        <span className="hidden sm:inline text-[10px]">{showPw ? 'HIDE' : 'SHOW'}</span>
                      </button>
                    </div>
                  </div>

                  <div className="flex items-center justify-between">
                    <label className="flex items-center gap-2 cursor-pointer select-none group">
                      <input type="checkbox" checked={remember} onChange={function() { setRemember(!remember); }} className="chk-box sr-only" />
                      <span className="chk relative w-[16px] h-[16px] border border-[#e2e8f0] rounded bg-white flex-shrink-0 block"></span>
                      <span className="text-xs text-[#64748b] font-medium">Remember me</span>
                    </label>
                    <button type="button" onClick={function() { setForgot(true); setError(''); }}
                      className="text-xs text-[#64748b] hover:text-[#6366F1] transition-colors bg-transparent border-0 font-medium"
                    >Forgot password?</button>
                  </div>

                  {error && (
                    <div className="bg-[#fef2f2] border border-[#fca5a5] text-[#dc2626] text-sm font-medium px-3 py-2 rounded-lg">{error}</div>
                  )}

                  <button type="submit" className="btn-primary w-full py-2.5 text-sm">Sign In</button>

                  <div className="fade-in d5 text-[10px] text-[#94a3b8] text-center mt-3 leading-relaxed">
                    <strong className="text-[#64748b]">Demo accounts</strong><br />
                    <span className="opacity-80">admin@datastream.com / password123 &nbsp;·&nbsp; creator@datastream.com / creator123<br />editor@datastream.com / editor123 &nbsp;·&nbsp; demo@datastream.com / demo1234</span>
                  </div>
                </form>
              ) : (
                <form onSubmit={handleSignup} className="fade-in d4 space-y-3.5">
                  <div>
                    <label className="block text-xs font-medium text-[#64748b] mb-1.5">Full Name</label>
                    <input type="text" value={sName} onChange={function(e) { setSName(e.target.value); }}
                      placeholder="Swagat Mohapatra"
                      className="input-focus w-full px-3.5 py-2.5 bg-[#f8fafc] border border-[#e2e8f0] rounded-lg text-sm text-[#1e293b] placeholder:text-[#94a3b8] outline-none transition-colors"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-[#64748b] mb-1.5">Email</label>
                    <input type="email" value={sEmail} onChange={function(e) { setSEmail(e.target.value); }}
                      placeholder="you@example.com"
                      className="input-focus w-full px-3.5 py-2.5 bg-[#f8fafc] border border-[#e2e8f0] rounded-lg text-sm text-[#1e293b] placeholder:text-[#94a3b8] outline-none transition-colors"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-[#64748b] mb-1.5">Password</label>
                    <div className="flex border border-[#e2e8f0] rounded-lg overflow-hidden bg-[#f8fafc]">
                      <input type={showSPw ? 'text' : 'password'} value={sPass} onChange={function(e) { setSPass(e.target.value); }}
                        placeholder="Min. 6 characters"
                        className="flex-1 min-w-0 px-3.5 py-2.5 bg-transparent text-sm text-[#1e293b] placeholder:text-[#94a3b8] outline-none border-0"
                      />
                      <button type="button" onClick={function() { setShowSPw(!showSPw); }} className="show-btn">
                        {showSPw ? <EyeClosed /> : <EyeOpen />}
                        <span className="hidden sm:inline text-[10px]">{showSPw ? 'HIDE' : 'SHOW'}</span>
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-[#64748b] mb-1.5">Confirm Password</label>
                    <div className="flex border border-[#e2e8f0] rounded-lg overflow-hidden bg-[#f8fafc]">
                      <input type={showSCon ? 'text' : 'password'} value={sConfirm} onChange={function(e) { setSConfirm(e.target.value); }}
                        placeholder="Re-enter password"
                        className="flex-1 min-w-0 px-3.5 py-2.5 bg-transparent text-sm text-[#1e293b] placeholder:text-[#94a3b8] outline-none border-0"
                      />
                      <button type="button" onClick={function() { setShowSCon(!showSCon); }} className="show-btn">
                        {showSCon ? <EyeClosed /> : <EyeOpen />}
                        <span className="hidden sm:inline text-[10px]">{showSCon ? 'HIDE' : 'SHOW'}</span>
                      </button>
                    </div>
                  </div>

                  {error && (
                    <div className="bg-[#fef2f2] border border-[#fca5a5] text-[#dc2626] text-sm font-medium px-3 py-2 rounded-lg">{error}</div>
                  )}

                  <button type="submit" className="btn-primary w-full py-2.5 text-sm">Create Account</button>
                </form>
              )}

              {!forgot && (
                <p className="fade-in d5 text-xs text-[#94a3b8] text-center mt-5">
                  {isLogin ? "Don't have an account? " : 'Already have an account? '}
                  <button type="button" onClick={function() { switchTab(isLogin ? 'signup' : 'login'); }}
                    className="text-[#6366F1] hover:text-[#4f46e5] transition-colors bg-transparent border-0 font-medium text-xs"
                  >{isLogin ? 'Sign Up' : 'Sign In'}</button>
                </p>
              )}
            </div>
          </div>

          <p className="fade-in d5 text-[10px] text-[#94a3b8] text-center mt-4">
            DataStream BI &mdash; 2026
          </p>
        </div>
      );
    }

    function EyeClosed() {
      return (
        <svg viewBox="0 0 24 24" className="w-[14px] h-[14px]" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
          <line x1="1" y1="1" x2="23" y2="23" />
        </svg>
      );
    }

    function EyeOpen() {
      return (
        <svg viewBox="0 0 24 24" className="w-[14px] h-[14px]" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(LoginPage));
  </script>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('datastream_bi_theme');
        if (theme === 'dark') { document.body.setAttribute('data-theme', 'dark'); }
      } catch(e) {}
    })();
  </script>
  <script>
    (function() {
      try {
        var users = JSON.parse(localStorage.getItem('datastream_bi_users') || '[]');
        if (users.length === 0) {
          users.push({ name: 'Admin User',      email: 'admin@datastream.com',   password: 'password123', initials: 'AU', role: 'admin' });
          users.push({ name: 'Creator User',    email: 'creator@datastream.com', password: 'creator123', initials: 'CU', role: 'creator' });
          users.push({ name: 'Editor User',     email: 'editor@datastream.com',  password: 'editor123',  initials: 'EU', role: 'editor' });
          users.push({ name: 'Viewer User',     email: 'demo@datastream.com',    password: 'demo1234',   initials: 'VU', role: 'viewer' });
          localStorage.setItem('datastream_bi_users', JSON.stringify(users));
        }
      } catch(e) {}
    })();
  </script>
</body>
</html>

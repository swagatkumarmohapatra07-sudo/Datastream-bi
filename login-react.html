<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataStream — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    #root { height: 100%; }

    .dot-grid {
      background-image: radial-gradient(#c084fc 1.2px, transparent 1.2px);
      background-size: 22px 22px;
    }

    .starburst { position: absolute; animation: spinSlow 20s linear infinite; }
    @keyframes spinSlow { to { transform: rotate(360deg); } }

    .smiley { animation: wobble 4s ease-in-out infinite; }
    @keyframes wobble {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-8px) rotate(-5deg); }
      75% { transform: translateY(4px) rotate(3deg); }
    }

    .sticker { animation: stickerDrift 6s ease-in-out infinite; }
    @keyframes stickerDrift {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }

    .card-pop { animation: cardPop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    @keyframes cardPop {
      0% { opacity: 0; transform: scale(0.92) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .pop { animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; opacity: 0; }
    @keyframes popIn { to { opacity: 1; transform: translateY(0); } }
    .p1 { animation-delay: 0.08s; } .p2 { animation-delay: 0.16s; }
    .p3 { animation-delay: 0.24s; } .p4 { animation-delay: 0.32s; }
    .p5 { animation-delay: 0.40s; }

    .press:active {
      transform: translate(4px, 4px) !important;
      box-shadow: none !important;
    }

    .brut-input:focus {
      outline: 3px solid #FACC15;
      outline-offset: 2px;
      background: #fff;
    }

    .brut-checkbox:checked + .chk {
      background: #38BDF8; border-color: #000;
    }
    .brut-checkbox:checked + .chk::after {
      content: ''; position: absolute; left: 5px; top: 1px;
      width: 6px; height: 10px;
      border: solid #000; border-width: 0 3px 3px 0; transform: rotate(45deg);
    }

    .show-btn {
      font-weight: 700; background: #E9D5FF; border-left: 2px solid #000;
      padding: 0 10px; cursor: pointer; font-size: 11px; white-space: nowrap;
      display: flex; align-items: center; gap: 4px; transition: background 0.15s;
    }
    .show-btn:hover { background: #ddd6fe; }
    .show-btn:active { background: #c4b5fd; }

    .shadow-brut { box-shadow: 6px 6px 0px 0px rgba(0,0,0,1); }
    .shadow-brut-sm { box-shadow: 4px 4px 0px 0px rgba(0,0,0,1); }

    @media (min-width: 640px) {
      .shadow-brut { box-shadow: 8px 8px 0px 0px rgba(0,0,0,1); }
    }
    @media (min-width: 1024px) {
      .shadow-brut { box-shadow: 10px 10px 0px 0px rgba(0,0,0,1); }
    }

    .scroll-wrap {
      display: flex; flex-direction: column;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .scroll-wrap > .card-pop { margin: auto; }

    @media (max-width: 639px) {
      .deco { display: none !important; }
    }
    @media (max-height: 680px) {
      .pop.p1, .pop.p5 { display: none !important; }
    }
    @media (max-height: 580px) {
      .card-inner { padding: 14px 12px !important; }
      .starburst, .smiley, .sticker { display: none !important; }
    }

    input, button { -webkit-tap-highlight-color: transparent; }
    button { touch-action: manipulation; cursor: pointer; }
    @media (pointer: coarse) { input, button { min-height: 44px; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    function LoginPage() {
      const [tab, setTab] = useState('login');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPw, setShowPw] = useState(false);
      const [remember, setRemember] = useState(true);

      const [sName, setSName] = useState('');
      const [sEmail, setSEmail] = useState('');
      const [sPass, setSPass] = useState('');
      const [sConfirm, setSConfirm] = useState('');
      const [showSPw, setShowSPw] = useState(false);
      const [showSCon, setShowSCon] = useState(false);

      const [error, setError] = useState('');
      const [forgot, setForgot] = useState(false);
      const [fEmail, setFEmail] = useState('');
      const [fMsg, setFMsg] = useState('');

      var isLogin = tab === 'login';

      function saveSession(name, email, initials) {
        sessionStorage.setItem('datastream_bi_session', JSON.stringify({ name: name, email: email, initials: initials }));
        window.location.href = 'index.html';
      }

      function handleLogin(e) {
        e.preventDefault();
        if (!email.trim() || !password.trim()) { setError('Please enter both email and password.'); return; }
        setError('');
        saveSession(email.split('@')[0], email, email.slice(0,2).toUpperCase());
      }

      function handleSignup(e) {
        e.preventDefault();
        if (!sName.trim() || !sEmail.trim() || !sPass.trim() || !sConfirm.trim()) { setError('Please fill in all fields.'); return; }
        if (sPass.length < 6) { setError('Password must be at least 6 characters.'); return; }
        if (sPass !== sConfirm) { setError('Passwords do not match.'); return; }
        setError('');
        var initials = sName.trim().split(/\s+/).slice(0,2).map(function(w) { return w[0].toUpperCase(); }).join('') || 'U';
        saveSession(sName.trim(), sEmail.trim(), initials);
      }

      function handleForgot(e) {
        e.preventDefault();
        setFMsg('');
        if (!fEmail.trim()) { setError('Enter your email address.'); return; }
        setError('');
        try {
          var data = JSON.parse(localStorage.getItem('datastream_bi_users') || '[]');
          var user = data.find(function(u) { return u.email === fEmail.trim(); });
          if (user) { setFMsg('Your password is: <strong>' + user.password + '</strong>'); }
          else { setError('No account found with that email.'); }
        } catch (err) { setError('Something went wrong.'); }
      }

      function switchTab(t) { setTab(t); setError(''); setForgot(false); }

      return (
        <div className="scroll-wrap h-full w-full bg-[#E9D5FF] dot-grid font-['Space_Grotesk',sans-serif] p-3 sm:p-4 md:p-5">

          <div className="deco starburst" style={{ top: 'clamp(6%,8%,10%)', left: 'clamp(4%,6%,8%)', width: 'clamp(36px,7vw,80px)', height: 'clamp(36px,7vw,80px)' }}><Starburst /></div>
          <div className="deco starburst" style={{ bottom: 'clamp(8%,10%,12%)', right: 'clamp(4%,5%,6%)', animationDuration: '25s', width: 'clamp(28px,5vw,60px)', height: 'clamp(28px,5vw,60px)' }}><Starburst /></div>
          <div className="deco smiley absolute" style={{ top: 'clamp(10%,12%,14%)', right: 'clamp(6%,8%,10%)', width: 'clamp(28px,4vw,48px)', height: 'clamp(28px,4vw,48px)' }}><Smiley /></div>
          <div className="deco sticker absolute" style={{ bottom: 'clamp(12%,14%,18%)', left: 'clamp(5%,7%,9%)' }}>
            <div className="bg-white border-[3px] border-black px-2 sm:px-3 py-1 sm:py-1.5 rotate-[-6deg] shadow-brut-sm">
              <span className="text-[9px] sm:text-xs font-bold">HELLO! ✨</span>
            </div>
          </div>

          <div className="card-pop w-full max-w-[320px] sm:max-w-[440px] md:max-w-[500px] bg-white border-[3px] sm:border-4 border-black shadow-brut">

            <div className="h-[7px] sm:h-2 md:h-3 bg-[#FF5733] border-b-[3px] sm:border-b-4 border-black"></div>

            <div className="card-inner p-5 sm:p-7 md:p-9">

              <div className="pop p1 text-center mb-3 sm:mb-4">
                <span className="inline-block bg-[#FACC15] border-2 border-black px-3 sm:px-4 py-1 sm:py-1.5 text-[11px] sm:text-xs md:text-sm font-bold tracking-tight rotate-[-2deg] shadow-brut-sm">
                  {forgot ? 'FORGOT PASSWORD' : (isLogin ? 'WELCOME BACK' : 'CREATE ACCOUNT')}
                </span>
              </div>

              <h1 className="pop p2 font-bold uppercase leading-[1.15] tracking-[-0.02em] text-black mb-4 sm:mb-5" style={{ fontSize: 'clamp(1.15rem, 4.5vw, 2rem)' }}>
                {forgot ? 'Reset your\npassword' : (isLogin ? 'Sign in to your\naccount' : 'Create your\naccount')}
              </h1>

              {!forgot && (
                <div className="pop p3 flex mb-4 sm:mb-5 border-[2px] sm:border-3 border-black rounded-md overflow-hidden">
                  <button className={"flex-1 py-2 sm:py-2.5 text-[11px] sm:text-xs md:text-sm font-bold uppercase tracking-wider transition-all " + (isLogin ? 'bg-black text-white' : 'bg-white text-black hover:bg-zinc-100')} onClick={function() { switchTab('login'); }}>Sign In</button>
                  <button className={"flex-1 py-2 sm:py-2.5 text-[11px] sm:text-xs md:text-sm font-bold uppercase tracking-wider transition-all border-l-[2px] sm:border-l-3 border-black " + (isLogin ? 'bg-white text-black hover:bg-zinc-100' : 'bg-black text-white')} onClick={function() { switchTab('signup'); }}>Sign Up</button>
                </div>
              )}

              {isLogin && forgot ? (
                <form onSubmit={handleForgot} className="pop p4 space-y-3 sm:space-y-4">
                  <div>
                    <label className="block text-[10px] sm:text-xs font-bold tracking-wider mb-1 uppercase">Email</label>
                    <input type="email" value={fEmail} onChange={function(e) { setFEmail(e.target.value); }}
                      placeholder="you@example.com"
                      className="brut-input w-full px-3 sm:px-4 py-2.5 sm:py-3 bg-zinc-100 border-[2px] sm:border-3 border-black text-xs sm:text-sm font-medium placeholder:text-zinc-400 outline-none"
                    />
                  </div>

                  {fMsg && (
                    <div className="bg-green-100 border-2 border-green-500 text-green-800 text-xs sm:text-sm font-bold px-3 py-2 rounded shadow-brut-sm" dangerouslySetInnerHTML={{ __html: fMsg }} />
                  )}
                  {error && (
                    <div className="bg-red-100 border-2 border-red-500 text-red-700 text-xs sm:text-sm font-bold px-3 py-2 rounded shadow-brut-sm">{error}</div>
                  )}

                  <button type="submit"
                    className="press w-full flex items-center justify-center gap-2 bg-[#38BDF8] border-[2px] sm:border-3 border-black px-4 py-3 text-xs sm:text-sm font-bold uppercase tracking-wide shadow-brut hover:-translate-y-0.5 transition-all"
                  >Show Password <span className="text-sm">&#128270;</span></button>

                  <button type="button" onClick={function() { setForgot(false); setFEmail(''); setFMsg(''); setError(''); }}
                    className="w-full text-center text-[10px] sm:text-xs font-bold underline underline-offset-2 hover:text-[#FF5733] transition-colors uppercase tracking-wider bg-transparent border-0"
                  >&#8592; Back to Sign In</button>
                </form>
              ) : isLogin ? (
                <form onSubmit={handleLogin} className="pop p4 space-y-3 sm:space-y-4">
                  <div>
                    <label className="block text-[10px] sm:text-xs font-bold tracking-wider mb-1 uppercase">Email</label>
                    <input type="email" value={email} onChange={function(e) { setEmail(e.target.value); }}
                      placeholder="you@example.com"
                      className="brut-input w-full px-3 sm:px-4 py-2.5 sm:py-3 bg-zinc-100 border-[2px] sm:border-3 border-black text-xs sm:text-sm font-medium placeholder:text-zinc-400 outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] sm:text-xs font-bold tracking-wider mb-1 uppercase">Password</label>
                    <div className="flex border-[2px] sm:border-3 border-black">
                      <input type={showPw ? 'text' : 'password'} value={password} onChange={function(e) { setPassword(e.target.value); }}
                        placeholder="Enter password"
                        className="brut-input flex-1 min-w-0 px-3 sm:px-4 py-2.5 sm:py-3 bg-zinc-100 text-xs sm:text-sm font-medium placeholder:text-zinc-400 outline-none border-0"
                      />
                      <button type="button" onClick={function() { setShowPw(!showPw); }} className="show-btn">
                        {showPw ? <EyeClosed /> : <EyeOpen />}
                        <span className="hidden sm:inline text-[10px] sm:text-xs">{showPw ? 'HIDE' : 'SHOW'}</span>
                      </button>
                    </div>
                  </div>

                  <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-1.5 pt-0.5">
                    <label className="flex items-center gap-2 cursor-pointer select-none group">
                      <input type="checkbox" checked={remember} onChange={function() { setRemember(!remember); }} className="brut-checkbox sr-only" />
                      <span className="chk relative w-[16px] h-[16px] sm:w-[18px] sm:h-[18px] border-[2px] sm:border-3 border-black bg-white flex-shrink-0 block"></span>
                      <span className="text-[10px] sm:text-xs font-bold tracking-wider uppercase">Remember</span>
                    </label>
                    <button type="button" onClick={function() { setForgot(true); setError(''); }}
                      className="text-[10px] sm:text-xs font-bold underline underline-offset-2 hover:text-[#FF5733] transition-colors uppercase tracking-wider bg-transparent border-0"
                    >Forgot?</button>
                  </div>

                  {error && (
                    <div className="bg-red-100 border-2 border-red-500 text-red-700 text-xs sm:text-sm font-bold px-3 py-2 rounded shadow-brut-sm">{error}</div>
                  )}

                  <button type="submit"
                    className="press w-full flex items-center justify-center gap-2 bg-[#FF5733] border-[2px] sm:border-3 border-black px-4 py-3 sm:py-3.5 text-xs sm:text-sm font-bold uppercase tracking-wide shadow-brut hover:-translate-y-0.5 transition-all"
                  >Let's Go <span className="text-sm sm:text-base">&#10132;</span></button>
                </form>
              ) : (
                <form onSubmit={handleSignup} className="pop p4 space-y-2.5 sm:space-y-3.5">
                  <div>
                    <label className="block text-[10px] sm:text-xs font-bold tracking-wider mb-1 uppercase">Full Name</label>
                    <input type="text" value={sName} onChange={function(e) { setSName(e.target.value); }}
                      placeholder="Swagat Mohapatra"
                      className="brut-input w-full px-3 sm:px-4 py-2.5 sm:py-3 bg-zinc-100 border-[2px] sm:border-3 border-black text-xs sm:text-sm font-medium placeholder:text-zinc-400 outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] sm:text-xs font-bold tracking-wider mb-1 uppercase">Email</label>
                    <input type="email" value={sEmail} onChange={function(e) { setSEmail(e.target.value); }}
                      placeholder="you@example.com"
                      className="brut-input w-full px-3 sm:px-4 py-2.5 sm:py-3 bg-zinc-100 border-[2px] sm:border-3 border-black text-xs sm:text-sm font-medium placeholder:text-zinc-400 outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] sm:text-xs font-bold tracking-wider mb-1 uppercase">Password</label>
                    <div className="flex border-[2px] sm:border-3 border-black">
                      <input type={showSPw ? 'text' : 'password'} value={sPass} onChange={function(e) { setSPass(e.target.value); }}
                        placeholder="Min. 6 characters"
                        className="brut-input flex-1 min-w-0 px-3 sm:px-4 py-2.5 sm:py-3 bg-zinc-100 text-xs sm:text-sm font-medium placeholder:text-zinc-400 outline-none border-0"
                      />
                      <button type="button" onClick={function() { setShowSPw(!showSPw); }} className="show-btn">
                        {showSPw ? <EyeClosed /> : <EyeOpen />}
                        <span className="hidden sm:inline text-[10px] sm:text-xs">{showSPw ? 'HIDE' : 'SHOW'}</span>
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="block text-[10px] sm:text-xs font-bold tracking-wider mb-1 uppercase">Confirm</label>
                    <div className="flex border-[2px] sm:border-3 border-black">
                      <input type={showSCon ? 'text' : 'password'} value={sConfirm} onChange={function(e) { setSConfirm(e.target.value); }}
                        placeholder="Re-enter password"
                        className="brut-input flex-1 min-w-0 px-3 sm:px-4 py-2.5 sm:py-3 bg-zinc-100 text-xs sm:text-sm font-medium placeholder:text-zinc-400 outline-none border-0"
                      />
                      <button type="button" onClick={function() { setShowSCon(!showSCon); }} className="show-btn">
                        {showSCon ? <EyeClosed /> : <EyeOpen />}
                        <span className="hidden sm:inline text-[10px] sm:text-xs">{showSCon ? 'HIDE' : 'SHOW'}</span>
                      </button>
                    </div>
                  </div>

                  {error && (
                    <div className="bg-red-100 border-2 border-red-500 text-red-700 text-xs sm:text-sm font-bold px-3 py-2 rounded shadow-brut-sm">{error}</div>
                  )}

                  <button type="submit"
                    className="press w-full flex items-center justify-center gap-2 bg-[#38BDF8] border-[2px] sm:border-3 border-black px-4 py-3 sm:py-3.5 text-xs sm:text-sm font-bold uppercase tracking-wide shadow-brut hover:-translate-y-0.5 transition-all"
                  >Create Account <span className="text-sm sm:text-base">&#10132;</span></button>
                </form>
              )}

              {!forgot && (
                <p className="pop p5 text-[10px] sm:text-xs font-bold text-center mt-4 sm:mt-5 uppercase tracking-wider">
                  {isLogin ? "Don't have an account? " : 'Already have an account? '}
                  <button type="button" onClick={function() { switchTab(isLogin ? 'signup' : 'login'); }}
                    className="underline underline-offset-2 hover:text-[#38BDF8] transition-colors bg-transparent border-0 font-bold text-[10px] sm:text-xs"
                  >{isLogin ? 'Sign Up' : 'Sign In'}</button>
                </p>
              )}
            </div>

            <div className="h-[7px] sm:h-2 md:h-3 bg-[#38BDF8] border-t-[3px] sm:border-t-4 border-black"></div>
          </div>

          <p className="pop p5 text-[9px] sm:text-[10px] font-bold text-zinc-500 uppercase tracking-widest text-center mt-3 sm:mt-4">
            DataStream BI &mdash; 2026
          </p>
        </div>
      );
    }

    function Starburst() {
      var lines = [];
      for (var i = 0; i < 12; i++) { var a = i * 30 * Math.PI / 180; lines.push({ x1: 40 + Math.cos(a)*8, y1: 40 + Math.sin(a)*8, x2: 40 + Math.cos(a)*36, y2: 40 + Math.sin(a)*36 }); }
      return (
        <svg viewBox="0 0 80 80" className="w-full h-full">
          {lines.map(function(l,i) { return <line key={i} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2} stroke="#000" strokeWidth="1.8" opacity="0.3" />; })}
          <circle cx="40" cy="40" r="20" fill="none" stroke="#000" strokeWidth="1.8" opacity="0.15" />
          <circle cx="40" cy="40" r="4" fill="#000" opacity="0.25" />
        </svg>
      );
    }

    function Smiley() {
      return (
        <svg viewBox="0 0 48 48" className="w-full h-full" fill="none" stroke="#000" strokeWidth="2.5">
          <circle cx="24" cy="24" r="20" fill="#FACC15" strokeWidth="3" />
          <circle cx="18" cy="20" r="2.5" fill="#000" />
          <circle cx="30" cy="20" r="2.5" fill="#000" />
          <path d="M16 30 Q24 38 32 30" strokeWidth="3" strokeLinecap="round" />
        </svg>
      );
    }

    function EyeClosed() {
      return (
        <svg viewBox="0 0 24 24" className="w-[14px] h-[14px]" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
          <line x1="1" y1="1" x2="23" y2="23" />
        </svg>
      );
    }

    function EyeOpen() {
      return (
        <svg viewBox="0 0 24 24" className="w-[14px] h-[14px]" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(LoginPage));
  </script>
</body>
</html>

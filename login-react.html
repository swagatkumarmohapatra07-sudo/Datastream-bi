<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataStream — Log In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ─── Retro dot grid ─── */
    .dot-grid {
      background-image: radial-gradient(#c084fc 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }

    /* ─── Starburst wireframe ─── */
    .starburst {
      position: absolute;
      width: 80px; height: 80px;
      animation: spinSlow 20s linear infinite;
    }
    @keyframes spinSlow { to { transform: rotate(360deg); } }

    /* ─── Smiley float ─── */
    .smiley { animation: wobble 4s ease-in-out infinite; }
    @keyframes wobble {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-8px) rotate(-5deg); }
      75% { transform: translateY(4px) rotate(3deg); }
    }

    /* ─── Sticker float ─── */
    .sticker { animation: stickerDrift 6s ease-in-out infinite; }
    @keyframes stickerDrift {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }

    /* ─── Card entrance ─── */
    .card-pop { animation: cardPop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    @keyframes cardPop {
      0% { opacity: 0; transform: scale(0.92) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ─── Stagger ─── */
    .pop { animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; opacity: 0; }
    @keyframes popIn { to { opacity: 1; transform: translateY(0); } }
    .p1 { animation-delay: 0.08s; } .p2 { animation-delay: 0.16s; }
    .p3 { animation-delay: 0.24s; } .p4 { animation-delay: 0.32s; }
    .p5 { animation-delay: 0.40s; } .p6 { animation-delay: 0.48s; }
    .p7 { animation-delay: 0.56s; } .p8 { animation-delay: 0.64s; }

    /* ─── Press effect ─── */
    .press:active {
      transform: translate(4px, 4px) !important;
      box-shadow: none !important;
    }

    /* ─── Input focus ─── */
    .brut-input:focus {
      outline: 3px solid #FACC15;
      outline-offset: 2px;
      background: #fff;
    }

    /* ─── Checkbox custom ─── */
    .brut-checkbox:checked + .check-box {
      background: #38BDF8;
      border-color: #000;
    }
    .brut-checkbox:checked + .check-box::after {
      content: '';
      position: absolute; left: 5px; top: 1px;
      width: 6px; height: 10px;
      border: solid #000;
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }
    @media (min-width: 768px) {
      .brut-checkbox:checked + .check-box::after {
        left: 7px; top: 2px;
        width: 7px; height: 12px;
        border-width: 0 3px 3px 0;
      }
    }

    /* ─── Toggle show ─── */
    .show-btn {
      font-weight: 700; letter-spacing: 0.05em;
      background: #E9D5FF; border: 2px solid #000;
      padding: 4px 10px; cursor: pointer;
      transition: transform 0.1s ease;
      font-size: 11px;
    }
    .show-btn:active { transform: translate(2px, 2px); }
    @media (min-width: 768px) {
      .show-btn { font-size: 13px; padding: 6px 14px; }
    }

    /* ─── Shadow utility ─── */
    .shadow-brut { box-shadow: 8px 8px 0px 0px rgba(0,0,0,1); }
    .shadow-brut-sm { box-shadow: 5px 5px 0px 0px rgba(0,0,0,1); }
    .shadow-brut-lg { box-shadow: 10px 10px 0px 0px rgba(0,0,0,1); }

    @media (max-width: 640px) {
      .deco { display: none; }
      .card-inner { padding: 24px 18px; }
      .shadow-brut { box-shadow: 5px 5px 0px 0px rgba(0,0,0,1); }
    }

    @media (min-width: 1024px) {
      .shadow-brut { box-shadow: 10px 10px 0px 0px rgba(0,0,0,1); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    /* ─── Components ─── */

    function Starburst() {
      const lines = [];
      for (let i = 0; i < 12; i++) {
        const angle = (i * 30) * Math.PI / 180;
        const x1 = 40 + Math.cos(angle) * 8;
        const y1 = 40 + Math.sin(angle) * 8;
        const x2 = 40 + Math.cos(angle) * 36;
        const y2 = 40 + Math.sin(angle) * 36;
        lines.push({ x1, y1, x2, y2 });
      }
      return (
        <svg viewBox="0 0 80 80" className="w-full h-full">
          {lines.map((l, i) => (
            <line key={i} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2} stroke="#000" strokeWidth="1.8" opacity="0.3" />
          ))}
          <circle cx="40" cy="40" r="20" fill="none" stroke="#000" strokeWidth="1.8" opacity="0.15" />
          <circle cx="40" cy="40" r="4" fill="#000" opacity="0.25" />
        </svg>
      );
    }

    function Smiley() {
      return (
        <svg viewBox="0 0 48 48" className="w-full h-full" fill="none" stroke="#000" strokeWidth="2.5">
          <circle cx="24" cy="24" r="20" fill="#FACC15" strokeWidth="3" />
          <circle cx="18" cy="20" r="2.5" fill="#000" stroke="none" />
          <circle cx="30" cy="20" r="2.5" fill="#000" stroke="none" />
          <path d="M16 30 Q24 38 32 30" strokeWidth="3" strokeLinecap="round" fill="none" />
        </svg>
      );
    }

    function GoogleIcon() {
      return (
        <svg viewBox="0 0 24 24" className="w-[18px] h-[18px] shrink-0">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
      );
    }

    function EyeClosed() {
      return (
        <svg viewBox="0 0 24 24" className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      );
    }

    function EyeOpen() {
      return (
        <svg viewBox="0 0 24 24" className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      );
    }

    /* ─── Main ─── */
    function LoginPage() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPw, setShowPw] = useState(false);
      const [remember, setRemember] = useState(true);

      return (
        <div className="relative min-h-screen w-screen flex items-center justify-center bg-[#E9D5FF] dot-grid overflow-hidden p-5 font-['Space_Grotesk',sans-serif]">

          {/* ─── Floating decor ─── */}
          <div className="deco starburst top-[8%] left-[6%] w-16 h-16 md:w-24 md:h-24 lg:w-28 lg:h-28"><Starburst /></div>
          <div className="deco starburst bottom-[10%] right-[5%]" style={{ animationDuration: '25s', width: 48, height: 48 }}><div className="md:hidden"><Starburst /></div></div>
          <div className="deco starburst bottom-[10%] right-[5%] hidden md:block" style={{ animationDuration: '25s', width: 72, height: 72 }}><Starburst /></div>

          <div className="deco smiley absolute top-[12%] right-[8%] w-10 h-10 sm:w-12 sm:h-12 md:w-16 md:h-16"><Smiley /></div>

          <div className="deco sticker absolute bottom-[15%] left-[8%] bg-white border-[3px] border-black px-2 sm:px-3 md:px-4 py-1 sm:py-1.5 md:py-2 rotate-[-6deg] shadow-brut-sm">
            <span className="text-[10px] sm:text-xs md:text-sm font-bold tracking-tight">HI THERE! ✨</span>
          </div>

          {/* ─── Card ─── */}
          <div className="card-pop w-full max-w-[360px] sm:max-w-[460px] md:max-w-[520px] lg:max-w-[560px] bg-white border-4 border-black shadow-brut">

            {/* Top accent stripe */}
            <div className="h-2 md:h-3 bg-[#FF5733] border-b-4 border-black"></div>

            <div className="card-inner p-6 sm:p-8 md:p-10">
              {/* Badge */}
              <div className="pop p1 -mt-1 mb-4 sm:mb-5 md:mb-6">
                <span className="inline-block bg-[#FACC15] border-2 border-black px-3 sm:px-4 md:px-5 py-1.5 md:py-2 text-xs sm:text-sm md:text-base font-bold tracking-tight rotate-[-2deg] shadow-brut-sm">
                  WELCOME BACK! 👋
                </span>
              </div>

              {/* Heading */}
              <h1 className="pop p2 text-xl sm:text-2xl md:text-3xl lg:text-4xl font-bold uppercase leading-[1.1] tracking-[-0.02em] text-black mb-5 sm:mb-7 md:mb-8">
                Log in to<br />your account
              </h1>

              {/* Google button */}
              <button className="pop p3 w-full flex items-center justify-center gap-2 sm:gap-3 bg-[#38BDF8] border-3 border-black px-4 sm:px-5 md:px-6 py-3 md:py-3.5 text-xs sm:text-sm md:text-base font-bold uppercase tracking-wide shadow-brut-sm hover:-translate-y-0.5 transition-transform active:translate-x-1 active:translate-y-1 active:shadow-none"
                style={{ borderWidth: 3 }}
              >
                <GoogleIcon />
                Sign in with Google
              </button>

              {/* Divider */}
              <div className="pop p4 flex items-center gap-3 sm:gap-4 my-5 sm:my-6 md:my-7">
                <div className="flex-1 border-t-4 border-black"></div>
                <span className="text-[10px] sm:text-xs md:text-sm font-bold tracking-widest bg-black text-white px-3 sm:px-4 py-1 md:py-1.5">OR</span>
                <div className="flex-1 border-t-4 border-black"></div>
              </div>

              {/* Form */}
              <form onSubmit={e => e.preventDefault()} className="pop p5 space-y-4 sm:space-y-5 md:space-y-6">
                {/* Email */}
                <div>
                  <label className="block text-[10px] sm:text-xs md:text-sm font-bold tracking-wider mb-1 sm:mb-1.5 md:mb-2 uppercase">Email</label>
                  <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                    placeholder="you@example.com"
                    className="brut-input w-full px-3 sm:px-4 md:px-5 py-2.5 sm:py-3 md:py-4 bg-zinc-100 border-3 border-black text-xs sm:text-sm md:text-base font-medium placeholder:text-zinc-400 outline-none"
                    style={{ borderWidth: 3 }}
                  />
                </div>

                {/* Password */}
                <div>
                  <label className="block text-[10px] sm:text-xs md:text-sm font-bold tracking-wider mb-1 sm:mb-1.5 md:mb-2 uppercase">Password</label>
                  <div className="flex border-3 border-black" style={{ borderWidth: 3 }}>
                    <input type={showPw ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)}
                      placeholder="Enter your password"
                      className="brut-input flex-1 px-3 sm:px-4 md:px-5 py-2.5 sm:py-3 md:py-4 bg-zinc-100 text-xs sm:text-sm md:text-base font-medium placeholder:text-zinc-400 outline-none border-0"
                    />
                    <button type="button" onClick={() => setShowPw(!showPw)}
                      className="show-btn flex items-center gap-1 sm:gap-1.5 m-1 sm:m-1.5"
                    >
                      {showPw ? <EyeClosed /> : <EyeOpen />}
                      <span className="hidden sm:inline">{showPw ? 'HIDE' : 'SHOW'}</span>
                    </button>
                  </div>
                </div>

                {/* Options */}
                <div className="flex items-center justify-between pt-1 sm:pt-1.5">
                  <label className="flex items-center gap-2 sm:gap-2.5 md:gap-3 cursor-pointer select-none group">
                    <input type="checkbox" checked={remember} onChange={() => setRemember(!remember)} className="brut-checkbox sr-only" />
                    <span className="check-box relative w-[18px] h-[18px] sm:w-5 sm:h-5 md:w-6 md:h-6 border-3 border-black bg-white flex-shrink-0 block group-hover:bg-zinc-100 transition-colors"
                      style={{ borderWidth: 3 }}
                    ></span>
                    <span className="text-[10px] sm:text-xs md:text-sm font-bold tracking-wider uppercase">Remember me</span>
                  </label>
                  <a href="#" className="text-[10px] sm:text-xs md:text-sm font-bold underline underline-offset-2 sm:underline-offset-4 decoration-2 hover:text-[#FF5733] transition-colors uppercase tracking-wider">
                    Forgot password?
                  </a>
                </div>

                {/* CTA */}
                <button type="submit"
                  className="press w-full flex items-center justify-center gap-2 sm:gap-2.5 md:gap-3 bg-[#FF5733] border-3 border-black px-4 sm:px-5 md:px-6 py-3 sm:py-3.5 md:py-4 text-xs sm:text-sm md:text-base font-bold uppercase tracking-wide shadow-brut hover:-translate-y-0.5 transition-all"
                  style={{ borderWidth: 3 }}
                >
                  Let's Go
                  <span className="text-base sm:text-lg md:text-xl">➔</span>
                </button>
              </form>

              {/* Footer */}
              <p className="pop p6 text-[10px] sm:text-xs md:text-sm font-bold text-center mt-5 sm:mt-6 md:mt-7 uppercase tracking-wider">
                Don't have an account?{' '}
                <a href="#" className="underline underline-offset-2 sm:underline-offset-4 decoration-2 hover:text-[#38BDF8] transition-colors">Sign Up</a>
              </p>
            </div>

            {/* Bottom accent stripe */}
            <div className="h-2 md:h-3 bg-[#38BDF8] border-t-4 border-black"></div>
          </div>

          {/* Bottom note */}
          <p className="pop p7 absolute bottom-4 sm:bottom-5 md:bottom-6 text-[10px] sm:text-xs md:text-sm font-bold text-zinc-500 uppercase tracking-widest">
            DataStream BI &mdash; 2026
          </p>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LoginPage />);
  </script>
</body>
</html>
